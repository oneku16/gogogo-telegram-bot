services:
  gogogo-bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile.local
    container_name: gogogo-bot
    ports:
      - "8001:8001"
    volumes:
      - ../:/app
    env_file:
      - ../.env
    environment:
      # Use host.docker.internal to reach backend running on host port 8000
      - API_BASE_URL=http://host.docker.internal:8000/api/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
